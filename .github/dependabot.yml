version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      prod:
        dependency-type: production
      dev:
        dependency-type: development

  # Tracks the node base image in Dockerfile (the thing grype complained about).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
