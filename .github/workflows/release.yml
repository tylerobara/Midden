name: Release

on:
  push:
    # Any numeric release tag, with or without a v prefix: 1, 1.4, 1.4.0, v1.4.0.
    # Glob is broad; the jobs enforce strict numeric form.
    tags: ['v[0-9]*', '[0-9]*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap
      - run: SKIP_E2E=1 scripts/ci-test.sh
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          base="${GITHUB_REF_NAME#v}"
          [[ "$base" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}$ ]] || { echo "not a numeric release tag: $GITHUB_REF_NAME" >&2; exit 1; }
          echo "version=$base" >> "$GITHUB_OUTPUT"
      - run: scripts/ci-build-image.sh "${{ steps.img.outputs.image }}" "${{ steps.img.outputs.version }}" --push
      - name: Scan pushed image
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          # --only-fixed: CVEs with no distro patch yet (e.g. zlib CVE-2026-85091) must not block a release.
          grype "${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}" --fail-on critical --only-fixed
      - run: scripts/ci-build-image.sh "${{ steps.img.outputs.image }}" latest --push
      - run: scripts/ci-release-assets.sh "${{ steps.img.outputs.version }}"
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Publish chart as OCI artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="${GITHUB_REF_NAME#v}"
          [[ "$base" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}$ ]] || { echo "not a numeric release tag: $GITHUB_REF_NAME" >&2; exit 1; }
          # Helm requires full semver: tag 1.4 becomes chart 1.4.0.
          IFS=. read -r ma mi pa <<<"$base"
          version="$ma.${mi:-0}.${pa:-0}"
          helm lint chart/midden
          helm package chart/midden --version "$version" --app-version "$version" --destination /tmp
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/midden-$version.tgz" "oci://ghcr.io/$owner/charts"
